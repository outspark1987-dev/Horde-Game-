 c.translate(0,-b)}

 t.innerHTML=`<h4>${n[8]}</h4>${n[9]}<div>${n[10]}: ${f(r)}${r<n[4]?' → <span style="color:#8f8">'+f(r+1)+'</span>':' (Max)'}</div>`;t.style.display='block';const b=el.getBoundingClientRect();let x=b.right+10;if(x+t.offsetWidth>innerWidth)x=b.left-t.offsetWidth-10;t.style.left=Math.max(4,x)+'px';t.style.top=Math.min(innerHeight-t.offsetHeight-4,Math.max(4,b.top))+'px'}
function tbuy(id){const n=tdef(id);if(T(id)>=n[4]||(n[3]&&!T(n[3])))return;const c=tcost(n);if(sv.souls<c)return;sv.souls-=c;sv.t[id]=T(id)+1;save();buildTree();const e=document.querySelector(`.tn[data-id=${id}]`);if(e)tip(e)}
$('#tree').addEventListener('pointerover',e=>{if(e.pointerType!='mouse')return;const el=e.target.closest('.tn');if(el)tip(el)});
$('#tree').addEventListener('pointerout',e=>{if(e.pointerType=='mouse')$('#tip').style.display='none'});
$('#tree').addEventListener('click',e=>{const el=e.target.closest('.tn');if(!el)return;const id=el.dataset.id;if(e.pointerType=='mouse'||e.detail==0||tsel==id){tbuy(id)}else{tsel=id;tip(el)}});
function openMenu(){paused=true;$('#menu').style.display='flex';tsel=null;buildTree()}
function closeMenu(){$('#menu').style.display='none';$('#tip').style.display='none';paused=false;$('#bPause').textContent='⏸';refresh()}
$('#bMenu').onclick=openMenu;$('#bTal').onclick=openMenu;$('#oTal').onclick=openMenu;$('#mBack').onclick=closeMenu;
$('#mRestart').onclick=()=>{if(confirm('Aktuellen Durchgang neu starten?')){newRun();closeMenu()}};
$('#mWipe').onclick=()=>{if(confirm('Gesamten Spielstand löschen?')){localStorage.removeItem(SAVE);sv={t:{},souls:0,best:1,spd:1,run:null};newRun();buildTree()}};
$('#oBtn').onclick=()=>{newRun()};
$('#bPause').onclick=()=>{paused=!paused;$('#bPause').textContent=paused?'▶':'⏸'};
const SPD=[1,2,4,8];$('#bSpd').onclick=()=>{sv.spd=SPD[(SPD.indexOf(sv.spd)+1)%4];$('#bSpd').textContent=sv.spd+'x'};
addEventListener('keydown',e=>{if($('#menu').style.display=='flex'){if(e.key=='Escape'||e.key.toLowerCase()=='t')closeMenu();return}const k=e.key.toLowerCase();if(k=='t')openMenu();else if(k=='f')hammer();else if('1234'.includes(k)&&k)buy(+k-1);else if(k==' '){e.preventDefault();$('#bPause').click()}});

setInterval(save,4000);addEventListener('beforeunload',save);document.addEventListener('visibilitychange',save);

addEventListener('resize',()=>setTimeout(resize,50));resize();
newRun();
if(sv.run&&sv.run.b){const r=sv.run;S.l=r.l;S.t=Math.min(r.t,D-5);S.gold=r.gold;S.c=Math.min(r.c,castMax());S.b=r.b;startLevel();S.t=Math.min(r.t,D-5)}
$('#bSpd').textContent=sv.spd+'x';
let last=performance.now(),rt=0;
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;
 if(!paused&&!S.over){const n=sv.spd;for(let i=0;i<n;i++)update(dt)}
 draw();rt-=dt;if(rt<=0){rt=.15;refresh()}prog();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
setTimeout(()=>toast('Kaufe Gebäude unten (1–4) und verbessere sie links!'),500);
